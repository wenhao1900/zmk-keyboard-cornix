# Cornix ZMK Configuration
# Mouse acceleration settings for faster cursor movement

# Enable ZMK mouse support
CONFIG_ZMK_MOUSE=y

# Mouse speed: higher = faster (default is typically 2-4)
# Set to 8 for significantly faster mouse cursor movement
CONFIG_ZMK_MOUSE_SPEED_MAX=8

# Time in ms to reach max speed (lower = faster acceleration)
# 300ms provides quick but controllable acceleration
CONFIG_ZMK_MOUSE_TIME_TO_MAX=300
